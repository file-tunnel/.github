name: reusable-organization-policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-caller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact caller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact PR head and live target ancestry
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [[ "$actual_head" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "::error::checkout drift: expected PR head $EXPECTED_HEAD_SHA, got $actual_head"
            exit 1
          fi

          # The checkout's origin/<base> remote-tracking ref is only a snapshot:
          # query the caller repository's *live* ref from GitHub, fail-closed.
          git check-ref-format --branch "$BASE_REF" >/dev/null
          live_base="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BASE_REF}" --jq '.object.sha')"

          sha40() { [[ "$1" =~ ^[0-9a-f]{40}$ ]]; }
          snapshot_ok() {
            sha40 "$1" && sha40 "$2" && sha40 "$3" && sha40 "$4" &&
              [[ "$1" == "$2" && "$3" == "$4" ]] &&
              git merge-base --is-ancestor "$4" "$1"
          }
          if ! sha40 "$live_base"; then
            echo "::error::live base ref did not resolve to a valid commit SHA"
            exit 1
          fi
          if [[ "$live_base" != "$EVENT_BASE_SHA" ]]; then
            echo "::error::target moved: event base $EVENT_BASE_SHA, live base $live_base; refresh/re-run"
            exit 1
          fi
          if ! snapshot_ok "$actual_head" "$EXPECTED_HEAD_SHA" "$EVENT_BASE_SHA" "$live_base"; then
            echo "::error::exact head, event/live base, or live-target ancestry check failed"
            exit 1
          fi

          # Adversarial negative checks against the *same* predicate; a false
          # success here is an admission-gate regression, not passing evidence.
          invalid=0000000000000000000000000000000000000000
          if snapshot_ok "$actual_head" "$invalid" "$EVENT_BASE_SHA" "$live_base" ||
             snapshot_ok "$actual_head" "$EXPECTED_HEAD_SHA" "$invalid" "$live_base" ||
             snapshot_ok "$actual_head" "$EXPECTED_HEAD_SHA" "$EVENT_BASE_SHA" "$invalid" 2>/dev/null; then
            echo "::error::base/head freshness predicate accepted a negative fixture"
            exit 1
          fi
          # A SHA can be valid and locally present but still be unrelated to
          # the proposed head: prove ancestry cannot be reduced to SHA shape.
          unrelated="$(printf 'orphan ancestry negative control\n' |
            git -c user.name='CI Fixture' -c user.email='ci@invalid.example' \
              commit-tree "$(git rev-parse 'HEAD^{tree}')")"
          if snapshot_ok "$actual_head" "$EXPECTED_HEAD_SHA" "$unrelated" "$unrelated"; then
            echo "::error::non-ancestor live target was admitted"
            exit 1
          fi
      - name: Require lowercase agent policy
        shell: bash
        run: |
          test -f agents.md
          grep -Fq "avoid git rebase in favor of git merge" agents.md
          grep -Fq "git stash" agents.md
          grep -Fq "git reset" agents.md
          grep -Fq "git clean" agents.md
          grep -Fq "git filter-repo" agents.md
      - name: Reject unresolved conflict markers
        shell: bash
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo "Unresolved conflict marker detected" >&2
            exit 1
          fi
      - name: Require immutable external Action pins
        shell: python
        run: |
          from pathlib import Path
          import re
          bad = []
          for path in Path('.github/workflows').glob('*.y*ml'):
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  match = re.search(r'^\s*(?:-\s+)?uses:\s*([^\s#]+)', line)
                  if not match:
                      continue
                  ref = match.group(1)
                  if ref.startswith('./'):
                      continue
                  if ref.startswith('docker://'):
                      if not re.search(r'@sha256:[0-9a-fA-F]{64}$', ref):
                          bad.append(f"{path}:{number}: {ref}")
                      continue
                  if not re.search(r'@[0-9a-fA-F]{40}$', ref):
                      bad.append(f"{path}:{number}: {ref}")
          if bad:
              raise SystemExit("External Actions must use full commit SHAs:\n" + "\n".join(bad))
